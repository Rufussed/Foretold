<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Foretold" />
    <meta name="theme-color" content="#080907" />
    <!-- SomaFM refuses a localhost referer for its stream, so none is sent. -->
    <meta name="referrer" content="no-referrer" />
    <title>Foretold – free online trick-taking card game with wizards</title>
    <!-- What search engines and link previews show. The site is one page (its
         views live after the #), so this one address is all there is to list;
         public/robots.txt and public/sitemap.xml point search engines here. -->
    <meta
      name="description"
      content="Foretold is a free online card game of wizards, jesters and foresight. Predict how many tricks you will win each round, then make it come true. A trick-taking game in the family of Oh Hell, Up and Down the River and Contract Whist. Play with friends or computer players in your browser."
    />
    <link rel="canonical" href="https://foretold.live/" />
    <!-- Proves to Google Search Console that we own the site. Keep it: removing
         it can drop the site's verification there. -->
    <meta name="google-site-verification" content="fAOSHPU_Jl9IvpKxorUR2WTg66EtiZYNrPnHtG4RVek" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Foretold" />
    <meta property="og:title" content="Foretold – free online trick-taking card game with wizards" />
    <meta
      property="og:description"
      content="Foresee how many tricks you will win, then make it come true. Play with friends or computer players, free in your browser."
    />
    <meta property="og:url" content="https://foretold.live/" />
    <meta property="og:image" content="https://foretold.live/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Foretold logo: a wizard's face above the word FORETOLD" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- For search engines only, never shown on the page: what kind of game
         this is, so it turns up for searches like "wizard card game" or
         "Oh Hell online". "wizard" stays an ordinary word here (the game has
         wizard cards and a wizard in its logo); the Wizard® brand is not
         named, see the trademark note in the project memory. -->
    <meta
      name="keywords"
      content="card game, wizard card game, wizards and jesters, trick-taking game, predict tricks, Oh Hell, Up and Down the River, Contract Whist, Estimation, online card game, multiplayer card game, free card game"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Foretold",
        "url": "https://foretold.live/",
        "image": "https://foretold.live/og-image.jpg",
        "description": "A free online card game of wizards, jesters and foresight: predict how many tricks you will win each round, then make it come true. A trick-taking game in the family of Oh Hell, Up and Down the River and Contract Whist.",
        "genre": ["Card game", "Trick-taking game"],
        "keywords": "wizard card game, predict, foretold, foretell, prediction, card game, trick-taking, Oh Hell, Up and Down the River, Contract Whist, Estimation",
        "playMode": ["MultiPlayer", "SinglePlayer"],
        "gamePlatform": "Web browser",
        "applicationCategory": "Game",
        "operatingSystem": "Any (web browser)",
        "inLanguage": ["en", "de"],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
